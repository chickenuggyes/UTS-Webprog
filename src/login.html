<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="input.css">
    <style>
    body {
        min-height: 100vh;
        margin: 0;
        font-family: 'Poppins', Arial, sans-serif;
        background-image: url('../uploads/background.jpg'); 
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 380px;
        padding: 40px 35px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.55); /* lebih solid */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #333; /* ganti ke gelap biar kebaca */
        text-align: center;
    }


    .container h2,
    .container p {
        color: #333;
    }

    .form-group {
        margin-bottom: 1.3rem;
        text-align: left;
    }

    .form-group label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.4rem;
        color: #444; /* lebih gelap biar jelas */
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 0.85rem;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        background: rgba(255, 255, 255, 0.8); /* lebih solid */
        color: #333;
        outline: none;
        box-sizing: border-box;
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 50px;
        padding-top: 0.85rem;
        padding-bottom: 0.85rem;
    }

    .password-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #666;
        padding: 4px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
        border-radius: 4px;
    }

    .password-toggle:hover {
        background: rgba(0, 0, 0, 0.05);
    }

    .password-toggle:hover {
        color: #333;
    }

    .password-toggle svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }


    .form-group input::placeholder {
        color: #777;
    }

    .btn {
    width: 100%;
    padding: 0.8rem;
    margin-top: 0.8rem;
    background: linear-gradient(135deg, #f8a1c4, #fdd1d1); /* pink muda → peach-pink */
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 3px 10px rgba(248, 161, 196, 0.4);
    }

    .btn:hover {
        transform: scale(1.02);
        background: linear-gradient(135deg, #f77aa6, #fbb1b1);
    }

    .extra {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        margin-top: 1rem;
        color: #ccc;
    }

    .signup-link {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #333;
    }

    .signup-link a {
        color: #a770ef;
        font-weight: 600;
        text-decoration: none;
    }

    .signup-link a:hover {
        text-decoration: underline;
    }

    .error {
        background: rgba(255, 0, 0, 0.1);
        color: #d32f2f;
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
        border: 1px solid rgba(211, 47, 47, 0.3);
    }

    .password-hint {
        display: block;
        font-size: 0.75rem;
        color: #666;
        margin-top: 0.3rem;
    }

    .form-group input:invalid {
        border: 1px solid rgba(211, 47, 47, 0.5);
    }

    /* Responsive untuk mobile */
    @media (max-width: 480px) {
        .container {
            width: 90%;
            padding: 30px 20px;
            margin: 20px;
        }

        .container h2 {
            font-size: 1.5rem;
        }

        .form-group input {
            font-size: 16px; /* Mencegah zoom di iOS */
        }
    }
</style>

</head>
<body>
    <div class="container">
        <div class="login-section">
            <div id="error" class="error" style="display:none;"></div>
            <form id="loginForm">
                <h2>Login</h2>
                <p>Welcome back! Please login to your account.</p>
                <div class="form-group">
                    <label for="identifier">Username atau Email</label>
                    <input type="text" id="identifier" name="identifier" placeholder="Masukkan username atau email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <button type="button" id="passwordToggle" class="password-toggle" aria-label="Toggle password visibility">
                            <svg id="passwordToggleIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="signup-link">
                New User? <a href="#" id="showSignup">Signup</a>
            </div>
            <form id="registerForm" style="display:none; margin-top:1rem;" novalidate>
                <h2 style="font-size:1.3rem; margin-bottom:0.5rem; color:#222;">Sign Up</h2>
                <p style="margin-bottom:1rem; color:#666; font-size:0.9rem;">Create your account to get started!</p>
                <div class="form-group">
                    <label for="regUsername">User Name</label>
                    <input type="text" id="regUsername" name="regUsername" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="text" id="regEmail" name="regEmail" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassword" name="regPassword" required>
                        <button type="button" id="regPasswordToggle" class="password-toggle" aria-label="Toggle password visibility">
                            <svg id="regPasswordToggleIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <small class="password-hint">Password minimal 8 karakter dan harus mengandung simbol</small>
                </div>
                <div class="form-group">
                    <label for="regPasswordConfirm">Konfirmasi Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPasswordConfirm" name="regPasswordConfirm" required>
                        <button type="button" id="regPasswordConfirmToggle" class="password-toggle" aria-label="Toggle password visibility">
                            <svg id="regPasswordConfirmToggleIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn">Register</button>
                <div class="signup-link" style="margin-top:0.5rem; position:relative; z-index:1;">
                    Sudah punya akun? <a href="#" id="showLogin">Login</a>
                </div>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
