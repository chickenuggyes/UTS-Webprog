<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      min-height:100vh;
      margin:0;
      background-image:url('../uploads/dashboard.jpg');
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
      font-family:'Poppins',Arial,sans-serif;
    }
    .bg-overlay{
      background:rgba(255,255,255,.65);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }
    .header-box{
      background:rgba(255,255,255,.3);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border-radius:16px;
      border:1px solid rgba(255,255,255,.4);
      padding:10px 25px;
      box-shadow:0 4px 10px rgba(0,0,0,.1);
      display:inline-block;
    }
    .header-title{font-size:26px;font-weight:700;color:#ec4899}
    .header-store-box{background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.5)}
    .header-store{font-size:20px;font-weight:600;color:#858383}
    .input{
      width:100%;
      border:1px solid #f9a8d4;
      background:rgba(255,255,255,.85);
      padding:.65rem .9rem;
      border-radius:.75rem;
      outline:none;
    }
  </style>
</head>
<body class="font-sans">
<div class="flex h-screen">
  <!-- Sidebar -->
  <aside class="w-64 bg-pink-100/90 shadow-lg flex flex-col no-print relative z-10">
    <div class="p-6 flex items-center justify-between">
      <div class="flex flex-col">
        <div id="sidebarUsername" class="text-2xl font-bold text-pink-600">Loading...</div>
        <div class="text-xs text-gray-500 mt-1">Admin</div>
      </div>
  <button id="profileBtn" class="w-10 h-10 rounded-full bg-pink-500 text-white grid place-items-center" title="Profile">👤</button>
    </div>
    <nav class="flex-1 px-4 space-y-2">
      <a href="dashboard.html" class="flex items-center p-2 rounded-lg hover:bg-pink-200 text-gray-800 font-medium transition-colors">
        <img src="https://img.icons8.com/color/24/combo-chart--v1.png" class="mr-3 w-5 h-5" />
        Dashboard
      </a>
      <a href="products.html" class="flex items-center p-2 rounded-lg hover:bg-pink-200 text-gray-800 font-medium transition-colors">
        <img src="https://img.icons8.com/color/24/box--v1.png" class="mr-3 w-5 h-5" />
        Products
      </a>
      <a href="add.html" class="flex items-center p-2 rounded-lg hover:bg-pink-200 text-gray-800 font-medium transition-colors">
        <img src="https://img.icons8.com/color/24/plus.png" class="mr-3 w-5 h-5" />
        Add Product
      </a>
      <a href="transaction.html" class="flex items-center p-2 rounded-lg hover:bg-pink-200 text-gray-800 font-medium transition-colors">
        <img src="https://img.icons8.com/color/24/transaction-list.png" class="mr-3 w-5 h-5" />
        Transactions
      </a>
    </nav>
    <div class="p-4 border-t">
      <a href="#" id="logoutBtn" class="flex items-center p-2 rounded-lg hover:bg-red-100 text-red-600 hover:text-red-700 font-medium transition-colors">
        <img src="https://img.icons8.com/color/24/exit.png" class="mr-3 w-5 h-5" />
        Sign Out
      </a>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-6 overflow-y-auto bg-overlay rounded-2xl shadow-md border border-pink-200 m-6">
    <div class="flex justify-between items-center mb-6">
      <div class="header-box"><h1 class="header-title">Stock In</h1></div>
      <div class="header-box header-store-box"><span class="header-store">Toko Gembira</span></div>
    </div>

    <div id="inError" class="text-red-600 mb-4"></div>

    <!-- Dynamic Rows -->
    <div id="rows" class="space-y-4"></div>

    <div class="mt-4 flex items-center gap-3">
      <button id="btnAddRow" class="px-4 py-2 bg-white border border-pink-200 rounded-lg hover:bg-pink-50">Add Row</button>
      <button id="btnSubmit" class="ml-auto px-6 py-2 bg-pink-500 text-white rounded-lg hover:bg-pink-600">Submit IN</button>
    </div>
  </main>
</div>

<script>
const API = "http://localhost:3000";

const rows = document.getElementById('rows');
const err  = document.getElementById('inError');

function rowTemplate(){
  return `
    <div class="tx-row bg-white/80 rounded-xl shadow border border-pink-100 p-4
                grid grid-cols-1 md:grid-cols-5 gap-3">
      <div class="md:col-span-2">
        <label class="text-sm text-gray-500">Barang</label>
        <select class="input item-select" required>
          <option value="">Pilih barang…</option>
        </select>
      </div>
      <div>
        <label class="text-sm text-gray-500">Qty</label>
        <input type="number" min="1" class="input qty-input" placeholder="0" required>
      </div>
      <div>
        <label class="text-sm text-gray-500">Supplier</label>
        <div class="input bg-gray-100 cursor-not-allowed flex items-center text-sm">
          <span class="supplier-name text-gray-700">-</span>
        </div>
        <input type="hidden" class="supplier-id-input" value="">
      </div>
      <div>
        <label class="text-sm text-gray-500">Catatan</label>
        <input type="text" class="input note-input" placeholder="opsional" autocomplete="off" tabindex="0">
      </div>
    </div>`;
}

async function getJSON(u){
  const r = await fetch(u);
  if(!r.ok) throw new Error(r.status+' '+r.statusText);
  return r.json();
}

let cachedItems   = [];
let itemsById     = {};
let suppliersById = {};

// helper buat update supplier satu baris
function updateSupplierForRow(rowEl, itemId) {
  const nameEl = rowEl.querySelector('.supplier-name');
  const idInput = rowEl.querySelector('.supplier-id-input');

  let supplierName = '-';
  let supplierId   = '';

  if (itemId && itemsById[itemId]) {
    const prod  = itemsById[itemId];
    const supid = prod.supid || prod.supplier_id || prod.supplierId;

    if (supid) {
      supplierId = supid;
      if (suppliersById[supid]) {
        supplierName = suppliersById[supid];
      } else {
        supplierName = supid; // fallback: tampilkan ID kalau nama belum ada
      }
    }
  }

  if (nameEl)  nameEl.textContent = supplierName;
  if (idInput) idInput.value      = supplierId;
}

async function hydrateSelects(container){
  const itemSel = container.querySelector('.item-select');
  if (!itemSel) return;

  itemSel.innerHTML =
    '<option value="">Pilih barang…</option>' +
    cachedItems
      .map(it => {
        const id   = it.id || it.itemId || it._id;
        const name = it.namaItem || it.name || it.nama || "-";
        return `<option value="${id}">${name}</option>`;
      })
      .join('');

  // ketika user pilih barang, langsung update supplier
  itemSel.addEventListener('change', (e) => {
    const rowEl = e.target.closest('.tx-row');
    const itemId = e.target.value;
    if (rowEl) updateSupplierForRow(rowEl, itemId);
  });
}

async function addRow(){
  rows.insertAdjacentHTML('beforeend', rowTemplate());
  const last = rows.lastElementChild;
  await hydrateSelects(last);
  
  // Pastikan input catatan di row baru bisa digunakan
  const noteInput = last.querySelector('.note-input');
  if (noteInput) {
    console.log('✅ Setting up note input for new row');
    noteInput.removeAttribute('disabled');
    noteInput.removeAttribute('readonly');
    noteInput.setAttribute('tabindex', '0');
    noteInput.style.pointerEvents = 'auto';
    noteInput.style.cursor = 'text';
    noteInput.style.opacity = '1';
    noteInput.style.background = '';
    noteInput.style.width = '100%';
    
    // Pastikan input bisa difokuskan
    noteInput.addEventListener('focus', function() {
      console.log('✅ Note input focused');
      this.style.outline = '2px solid #ec4899';
    });
    noteInput.addEventListener('blur', function() {
      this.style.outline = '';
    });
    
    // Test: pastikan input bisa diklik
    noteInput.addEventListener('click', function(e) {
      console.log('✅ Note input clicked');
      e.stopPropagation();
      this.focus();
    });
    
    // Test: pastikan input bisa menerima input
    noteInput.addEventListener('input', function() {
      console.log('✅ Note input value changed:', this.value);
    });
  } else {
    console.error('❌ Note input not found in new row!');
  }
}

// init: load items + suppliers, lalu tambah 1 baris
(async ()=>{
  try{
    const itemsRes = await getJSON(`${API}/items`);
    const items    = itemsRes.items || itemsRes || [];
    cachedItems    = items;

    itemsById = {};
    items.forEach(it => {
      const id = it.id || it.itemId || it._id;
      if (id) itemsById[id] = it;
    });
  }catch(e){
    console.error(e);
    cachedItems = [];
  }

  try{
    const supRes    = await getJSON(`${API}/suppliers`);
    const suppliers = supRes.suppliers || supRes || [];
    suppliersById = {};
    suppliers.forEach(s => {
      const id = s.supid || s.id || s.kode || s.code;
      if (!id) return;
      const name = s.namaSupplier || s.nama || s.name || id;
      suppliersById[id] = name;
    });
  }catch(e){
    console.error(e);
    suppliersById = {};
  }

  addRow();
})();

document.getElementById('btnAddRow').addEventListener('click', addRow);

document.getElementById('btnSubmit').addEventListener('click', async ()=>{
  err.textContent = '';
  const payload = [];

  rows.querySelectorAll('.tx-row').forEach(row=>{
    const itemId     = row.querySelector('.item-select')?.value;
    const qty        = Number(row.querySelector('.qty-input')?.value || 0);
    const supplierId = row.querySelector('.supplier-id-input')?.value || null;
    
    // Ambil catatan dari input field row ini saja, jangan ambil dari row lain
    const noteInput = row.querySelector('.note-input');
    const note = noteInput ? (noteInput.value || '').trim() : '';

    if(itemId && qty > 0){
      payload.push({ itemId, qty, supplierId, note });
    }
  });

  if(payload.length === 0){
    err.textContent = 'Minimal 1 baris valid.';
    return;
  }

  try{
    // Ambil user info dari localStorage (username dan user_id)
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const username = user.username || null;
    const user_id = user.id || null;
    
    if (!username) {
      console.error('❌ Username tidak ditemukan di localStorage!');
      err.textContent = 'Username tidak ditemukan. Silakan login ulang.';
      alert('⚠️ Username tidak ditemukan. Silakan login ulang.');
      return;
    }
    
    console.log('👤 User info:', { username, user_id });
    
    const res = await fetch(`${API}/transactions/in`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ 
        rows: payload,
        user_id: user_id
      })
    });
    
    const data = await res.json();
    if(!res.ok) {
      throw new Error(data.message || res.status+' '+res.statusText);
    }
    
    alert('Transaksi IN berhasil.');
    location.href = 'transaction.html';
  }catch(e){
    err.textContent = 'Gagal submit: ' + (e.message || 'error');
    console.error('Error:', e);
  }
});

// ----- sidebar username + logout + highlight -----
const user = JSON.parse(localStorage.getItem('user') || '{}');
if (user.username) {
  const nameEl = document.getElementById('sidebarUsername');
  if (nameEl) nameEl.textContent = user.username;
  document.title = user.username + ' — Stock In';
}

document.getElementById('logoutBtn')?.addEventListener('click', (e)=>{
  e.preventDefault();
  localStorage.removeItem('user');
  window.location.href = '../src/login.html';
});

const currentPage = location.pathname.split('/').pop();
document.querySelectorAll('aside nav a').forEach(link => {
  const href = link.getAttribute('href');
  // Highlight Transactions menu jika halaman adalah in.html atau out.html
  if ((currentPage === 'in.html' || currentPage === 'out.html') && href === 'transaction.html') {
    link.classList.add('bg-pink-400', 'text-white', 'shadow');
    link.classList.remove('text-gray-800');
  } else if (href === currentPage) {
    link.classList.add('bg-pink-400', 'text-white', 'shadow');
    link.classList.remove('text-gray-800');
  } else {
    link.classList.remove('bg-pink-400', 'text-white', 'shadow');
    link.classList.add('text-gray-800');
  }
});
</script>

  <!-- Profile modal -->
  <div id="profileModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 w-80 shadow-lg relative">
      <button id="profileClose" class="absolute top-3 right-3 text-gray-600 hover:text-gray-900">✕</button>
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-pink-600 mb-3">Profile</h3>
      </div>
      <div id="profileError" class="text-sm text-red-600 mb-2 hidden"></div>
      <form id="profileForm" class="text-sm text-gray-700 space-y-3">
        <div class="flex flex-col items-center mb-3">
          <div id="profileAvatarContainer" class="relative w-24 h-24 mb-3 group">
            <div id="profileAvatarPlaceholder"
              class="w-full h-full rounded-full bg-pink-500 text-white grid place-items-center text-3xl cursor-pointer"
              title="Unggah foto profile">👤</div>
            <img id="profileAvatar" src="" alt="avatar"
              class="w-full h-full rounded-full object-cover hidden cursor-pointer" title="Unggah foto profile" />
            <input type="file" id="profileFotoInput" accept="image/*" class="hidden">
            <div
              class="absolute inset-0 rounded-full bg-black/40 text-white grid place-items-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.218A2 2 0 0110.74 4h2.52a2 2 0 011.664.89l.812 1.218A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
          </div>
          <div class="text-xs text-gray-500">ID</div>
          <div class="font-mono text-sm text-gray-800 mb-3" id="profileId">-</div>
        </div>

        <div>
          <label class="text-xs text-gray-500">Username</label>
          <input id="profileUsernameInput" class="w-full border rounded px-2 py-1" type="text" />
        </div>

        <div>
          <label class="text-xs text-gray-500">Email</label>
          <input id="profileEmailInput" class="w-full border rounded px-2 py-1" type="email" />
        </div>

        <div>
          <label class="text-xs text-gray-500">Password (kosongkan jika tidak ingin mengubah)</label>
          <input id="profilePasswordInput" class="w-full border rounded px-2 py-1" type="password" />
        </div>

        <div class="mt-2 flex justify-between">
          <button id="profileLogout" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">Sign out</button>
          <div class="flex gap-2">
            <button id="profileCancel" class="px-3 py-1 bg-gray-200 rounded">Cancel</button>
            <button id="profileSave" class="px-3 py-1 bg-pink-500 text-white rounded">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Profile modal logic
    const profileBtn = document.getElementById('profileBtn');
    const profileModal = document.getElementById('profileModal');
    const profileClose = document.getElementById('profileClose');
    const profileLogout = document.getElementById('profileLogout');
    const profileSave = document.getElementById('profileSave');
    const profileCancel = document.getElementById('profileCancel');
    const profileError = document.getElementById('profileError');
    const sidebarUsername = document.getElementById('sidebarUsername');

    // Variabel untuk elemen gambar profil baru
    const profileFotoInput = document.getElementById('profileFotoInput');
    const profileAvatar = document.getElementById('profileAvatar');
    const profileAvatarContainer = document.getElementById('profileAvatarContainer');
    const profilePlaceholder = document.getElementById('profileAvatarPlaceholder');

    function openProfile() {
      profileError.classList.add('hidden');
      profileError.textContent = '';
      profileFotoInput.value = ''; // Reset input file

      const u = JSON.parse(localStorage.getItem('user') || '{}');
      document.getElementById('profileId').textContent = u.id || '-';
      document.getElementById('profileUsernameInput').value = u.username || '';
      document.getElementById('profileEmailInput').value = u.email || '';
      document.getElementById('profilePasswordInput').value = '';

      const avatarFilename = u.avatar || null;
      const pImg = document.getElementById('profileAvatar');
      const pPlaceholder = document.getElementById('profileAvatarPlaceholder');

      if (avatarFilename) {
        const avatarUrl = `${API}/uploads/${avatarFilename}`;
        pImg.src = avatarUrl;
        pImg.classList.remove('hidden');
        pPlaceholder.classList.add('hidden');
        // Update sidebar button
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) profileBtn.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover rounded-full"/>`;
      } else {
        pImg.classList.add('hidden');
        pPlaceholder.classList.remove('hidden');
        // Update sidebar button
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) profileBtn.innerHTML = '👤';
      }

      profileModal.classList.remove('hidden');
      profileModal.classList.add('flex');
      // Prevent body scroll when modal is open
      document.body.style.overflow = 'hidden';
    }

    function closeProfile() {
      profileModal.classList.add('hidden');
      profileModal.classList.remove('flex');
      // Restore body scroll when modal is closed
      document.body.style.overflow = '';
    }

    profileBtn?.addEventListener('click', (e) => { e.preventDefault(); openProfile(); });
    profileClose?.addEventListener('click', (e) => { e.preventDefault(); closeProfile(); });
    profileCancel?.addEventListener('click', (e) => { e.preventDefault(); closeProfile(); });
    profileModal?.addEventListener('click', (e) => { if (e.target === profileModal) closeProfile(); });

    profileLogout?.addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem('user'); window.location.href = '../src/login.html'; });

    profileSave?.addEventListener('click', async (e) => {
      e.preventDefault();
      profileError.classList.add('hidden');
      
      // Mengambil data user dari localStorage (sumber paling tepercaya untuk ID)
      const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
      const id = currentUser.id; // Ambil ID langsung dari objek user

      const usernameVal = document.getElementById('profileUsernameInput').value.trim();
      const emailVal = document.getElementById('profileEmailInput').value.trim();
      const passwordVal = document.getElementById('profilePasswordInput').value;
      const newFoto = document.getElementById('profileFotoInput').files[0];

      // Validasi ID (Penting!)
      if (!id) {
        profileError.textContent = 'Error: User ID tidak ditemukan di penyimpanan lokal. Silakan coba login ulang.';
        profileError.classList.remove('hidden');
        return;
      }

      if (!usernameVal || !emailVal) {
        profileError.textContent = 'Username dan email wajib diisi.';
        profileError.classList.remove('hidden');
        return;
      }

      // Gunakan FormData untuk mengirim data teks dan file
      const fd = new FormData();
      fd.append("id", id); // Sekarang menggunakan ID dari localStorage
      fd.append("username", usernameVal);
      fd.append("email", emailVal);
      if (passwordVal) fd.append("password", passwordVal);
      if (newFoto) fd.append("foto", newFoto);

      const profileSaveBtn = e.target;
      const prevText = profileSaveBtn.textContent;
      profileSaveBtn.disabled = true;
      profileSaveBtn.textContent = 'Saving...';

      try {
        const res = await fetch(`${API}/login/profile`, {
          method: 'PATCH',
          // Tidak perlu headers['Content-Type']='application/json' saat pakai FormData
          body: fd
        });
        const data = await res.json();
        if (!res.ok) {
          profileError.textContent = data.message || 'Gagal memperbarui profile.';
          profileError.classList.remove('hidden');
          return;
        }
        // update localStorage and UI
        localStorage.setItem('user', JSON.stringify(data.user));
        const sb = document.getElementById('sidebarUsername');
        if (sb) sb.textContent = data.user.username;
        
        // Perbarui tampilan avatar di sidebar setelah save berhasil
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) {
            if (data.user.avatar) {
                const avatarUrl = `${API}/uploads/${data.user.avatar}`;
                profileBtn.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover rounded-full"/>`;
                // Update juga di modal
                const pImg = document.getElementById('profileAvatar');
                const pPlaceholder = document.getElementById('profileAvatarPlaceholder');
                if (pImg && pPlaceholder) {
                  pImg.src = avatarUrl;
                  pImg.classList.remove('hidden');
                  pPlaceholder.classList.add('hidden');
                }
            } else {
                profileBtn.innerHTML = '👤';
            }
        }
        
        alert('Profil berhasil diperbarui!');
        closeProfile();
      } catch (err) {
        profileError.textContent = 'Terjadi kesalahan koneksi.';
        profileError.classList.remove('hidden');
      } finally {
        profileSaveBtn.disabled = false;
        profileSaveBtn.textContent = prevText;
      }
    });

    // Event listener untuk mengklik container avatar agar membuka input file
    profileAvatarContainer?.addEventListener('click', () => {
      profileFotoInput?.click();
    });

    // Profile crop functionality will be handled by profileCrop.js

    // Load profile avatar on page load
    (function() {
      const u = JSON.parse(localStorage.getItem('user') || '{}');
      const profileBtn = document.getElementById('profileBtn');
      if (profileBtn && u.avatar) {
        const avatarUrl = `${API}/uploads/${u.avatar}`;
        profileBtn.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover rounded-full"/>`;
      }
    })();
  </script>
  <script src="profileCrop.js"></script>
</body>
</html>
