<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="dynamicTitle">Transactions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print { .no-print{display:none!important} }
    body{
      min-height:100vh;margin:0;
      background-image:url('../uploads/dashboard.jpg');
      background-size:cover;background-position:center;background-attachment:fixed;
      font-family:'Poppins',Arial,sans-serif;
    }
    .bg-overlay{background:rgba(255,255,255,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .header-box{background:rgba(255,255,255,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border-radius:16px;border:1px solid rgba(255,255,255,.4);padding:10px 25px;box-shadow:0 4px 10px rgba(0,0,0,.1);display:inline-block}
    .header-title{font-size:26px;font-weight:700;color:#ec4899;text-shadow:0 1px 2px rgba(255,255,255,.7)}
    .header-store-box{background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.5)}
    .header-store{font-size:20px;font-weight:600;color:#858383;text-shadow:0 1px 3px rgba(56,52,52,.4)}
  </style>
</head>
<body class="font-sans">
<div class="flex h-screen">
  <!-- Sidebar -->
  <aside class="w-64 bg-pink-100/90 shadow-lg flex flex-col no-print relative z-10">
    <div class="p-6 flex items-center justify-between">
      <div class="flex flex-col">
        <div id="sidebarUsername" class="text-2xl font-bold text-pink-600">Loading...</div>
        <div class="text-xs text-gray-500 mt-1">Admin</div>
      </div>
      <button id="profileBtn" class="w-10 h-10 rounded-full bg-pink-500 text-white grid place-items-center" title="Profile">👤</button>
    </div>
    <nav class="flex-1 px-4 space-y-2">
      <a href="dashboard.html" class="flex items-center p-2 rounded-lg hover:bg-pink-200 text-gray-800 font-medium">
        <img src="https://img.icons8.com/color/24/combo-chart--v1.png" class="mr-3 w-5 h-5"/> Dashboard
      </a>
      <a href="products.html" class="flex items-center p-2 rounded-lg hover:bg-pink-200 text-gray-800 font-medium">
        <img src="https://img.icons8.com/color/24/box--v1.png" class="mr-3 w-5 h-5"/> Products
      </a>
      <a href="add.html" class="flex items-center p-2 rounded-lg hover:bg-pink-200 text-gray-800 font-medium">
        <img src="https://img.icons8.com/color/24/plus.png" class="mr-3 w-5 h-5" />
        Add Product
      </a>
      <a href="transaction.html" class="flex items-center p-2 rounded-lg hover:bg-pink-200 text-gray-800 font-medium">
        <img src="https://img.icons8.com/color/24/transaction-list.png" class="mr-3 w-5 h-5"/> Transactions
      </a>
    </nav>
    <div class="p-4 border-t">
      <a href="#" id="logoutBtn" class="flex items-center p-2 rounded-lg hover:bg-red-100 text-red-600 hover:text-red-700 font-medium transition-colors">
        <img src="https://img.icons8.com/color/24/exit.png" class="mr-3 w-5 h-5"/> Sign Out
      </a>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-6 overflow-y-auto bg-overlay rounded-2xl shadow-md border border-pink-200 m-6 relative z-10">
    <div class="flex justify-between items-center mb-6 no-print">
      <div class="header-box"><h1 class="header-title">Transactions</h1></div>
      <div class="header-box header-store-box"><span class="header-store">Toko Gembira</span></div>
    </div>

    <div id="txError" class="text-red-600 mb-4 no-print"></div>

    <!-- Stats (pakai API dashboard yang sama) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 no-print">
      <div class="bg-white/80 p-4 rounded-lg shadow border border-pink-100">
        <p class="text-gray-500">Total Item</p><h2 id="totalItem" class="text-3xl font-bold">...</h2>
      </div>
      <div class="bg-white/80 p-4 rounded-lg shadow border border-pink-100">
        <p class="text-gray-500">Total Stok</p><h2 id="totalStok" class="text-3xl font-bold">...</h2>
      </div>
      <div class="bg-white/80 p-4 rounded-lg shadow border border-pink-100">
        <p class="text-gray-500">Total Harga</p><h2 id="totalHarga" class="text-3xl font-bold">...</h2>
      </div>
    </div>

    <!-- Menu: In / Out / Stock Log + History -->
    <div class="mt-10 mb-6 flex items-center justify-between no-print">
      <div class="inline-flex rounded-lg bg-white/60 p-1 shadow border border-pink-100">
        <button id="btnIn"
          class="px-4 py-2 rounded-md font-semibold text-pink-600 hover:bg-pink-50">In</button>
        <button id="btnOut"
          class="px-4 py-2 rounded-md font-semibold text-pink-600 hover:bg-pink-50">Out</button>

        <!-- tombol baru: Stock Log & History -->
        <button id="btnStockLog"
          class="px-4 py-2 rounded-md font-semibold bg-pink-500 text-white">Stock Log</button>
        <button id="btnHistory"
          class="px-4 py-2 rounded-md font-semibold text-pink-600 hover:bg-pink-50">History</button>
      </div>
      <div></div>
    </div>

    <!-- SEARCH + FILTER (letakkan di sebelah kanan group tombol) -->
<div class="flex items-center gap-3">
  <!-- Search -->
  <div class="relative">
    <input id="txSearch" type="search" placeholder="Cari transaksi, item, supplier, note..." 
           class="px-3 py-2 w-72 rounded-md border focus:outline-none focus:ring-2 focus:ring-pink-300" />
    <div class="absolute right-2 top-2 text-gray-400">🔎</div>
  </div>

  <!-- Filter chips: All / IN / OUT -->
  <div id="txFilterGroup" class="inline-flex rounded-lg bg-white/60 p-1 shadow border border-pink-100">
    <button data-filter="ALL" class="tx-filter-chip px-3 py-2 rounded-md font-semibold text-pink-600 hover:bg-pink-50">All</button>
    <button data-filter="IN"  class="tx-filter-chip px-3 py-2 rounded-md font-semibold text-pink-600 hover:bg-pink-50">IN</button>
    <button data-filter="OUT" class="tx-filter-chip px-3 py-2 rounded-md font-semibold text-pink-600 hover:bg-pink-50">OUT</button>
  </div>
</div>


    <!-- STOCK LOG (tabel seperti sekarang) -->
    <div id="stockLogContainer" class="bg-white/80 rounded-lg shadow border border-pink-100">
      <div class="px-4 py-3 border-b text-sm text-gray-600">Riwayat perubahan stok</div>
      <div class="p-4 overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="text-left text-gray-500">
              <th class="py-2 pr-4">Username</th>
              <th class="py-2 pr-4">Transaksi ID</th>
              <th class="py-2 pr-4">Tanggal</th>
              <th class="py-2 pr-4">Tipe</th>
              <th class="py-2 pr-4">Barang</th>
              <th class="py-2 pr-4">Qty</th>
              <th class="py-2 pr-4">Supplier</th>
              <th class="py-2 pr-4">Catatan</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="8" class="py-4 text-gray-500">Memuat…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

<!-- HISTORY NOTA (nota per transaksi) -->
<div id="notaContainer"
     class="bg-white/80 rounded-lg shadow border border-pink-100 mt-6 hidden">
  <div class="px-4 py-3 border-b text-sm text-gray-600">
    History Nota Transaksi
  </div>

  <div id="notaList" class="p-4 space-y-6">
    <!-- isi nota via JS -->
  </div>
</div>



<script src="transaction.js"></script>

  <!-- Profile modal -->
  <div id="profileModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 w-80 shadow-lg relative">
      <button id="profileClose" class="absolute top-3 right-3 text-gray-600 hover:text-gray-900">✕</button>
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold text-pink-600 mb-3">Profile</h3>
      </div>
      <div id="profileError" class="text-sm text-red-600 mb-2 hidden"></div>
      <form id="profileForm" class="text-sm text-gray-700 space-y-3">
        <div class="flex flex-col items-center mb-3">
          <div id="profileAvatarContainer" class="relative w-24 h-24 mb-3 group">
            <div id="profileAvatarPlaceholder"
              class="w-full h-full rounded-full bg-pink-500 text-white grid place-items-center text-3xl cursor-pointer"
              title="Unggah foto profile">👤</div>
            <img id="profileAvatar" src="" alt="avatar"
              class="w-full h-full rounded-full object-cover hidden cursor-pointer" title="Unggah foto profile" />
            <input type="file" id="profileFotoInput" accept="image/*" class="hidden">
            <div
              class="absolute inset-0 rounded-full bg-black/40 text-white grid place-items-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.218A2 2 0 0110.74 4h2.52a2 2 0 011.664.89l.812 1.218A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
          </div>
          <div class="text-xs text-gray-500">ID</div>
          <div class="font-mono text-sm text-gray-800 mb-3" id="profileId">-</div>
        </div>

        <div>
          <label class="text-xs text-gray-500">Username</label>
          <input id="profileUsernameInput" class="w-full border rounded px-2 py-1" type="text" />
        </div>

        <div>
          <label class="text-xs text-gray-500">Email</label>
          <input id="profileEmailInput" class="w-full border rounded px-2 py-1" type="email" />
        </div>

        <div>
          <label class="text-xs text-gray-500">Password (kosongkan jika tidak ingin mengubah)</label>
          <input id="profilePasswordInput" class="w-full border rounded px-2 py-1" type="password" />
        </div>

        <div class="mt-2 flex justify-between">
          <button id="profileLogout" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">Sign out</button>
          <div class="flex gap-2">
            <button id="profileCancel" class="px-3 py-1 bg-gray-200 rounded">Cancel</button>
            <button id="profileSave" class="px-3 py-1 bg-pink-500 text-white rounded">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Profile modal logic
    const profileBtn = document.getElementById('profileBtn');
    const profileModal = document.getElementById('profileModal');
    const profileClose = document.getElementById('profileClose');
    const profileLogout = document.getElementById('profileLogout');
    const profileSave = document.getElementById('profileSave');
    const profileCancel = document.getElementById('profileCancel');
    const profileError = document.getElementById('profileError');
    const sidebarUsername = document.getElementById('sidebarUsername');

    function openProfile() {
      profileError.classList.add('hidden');
      profileError.textContent = '';
      profileFotoInput.value = ''; // Reset input file

      const u = JSON.parse(localStorage.getItem('user') || '{}');
      document.getElementById('profileId').textContent = u.id || '-';
      document.getElementById('profileUsernameInput').value = u.username || '';
      document.getElementById('profileEmailInput').value = u.email || '';
      document.getElementById('profilePasswordInput').value = '';

      const avatarUrl = u.avatar || null;
      const pImg = document.getElementById('profileAvatar');
      const pPlaceholder = document.getElementById('profileAvatarPlaceholder');

      if (avatarUrl) {
        pImg.src = avatarUrl;
        pImg.classList.remove('hidden');
        pPlaceholder.classList.add('hidden');
        // Update sidebar button
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) profileBtn.innerHTML = `<img src="${avatarUrl}" class="w-full h-full object-cover rounded-full"/>`;
      } else {
        pImg.classList.add('hidden');
        pPlaceholder.classList.remove('hidden');
        // Update sidebar button
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) profileBtn.innerHTML = '👤';
      }

      profileModal.classList.remove('hidden');
      profileModal.classList.add('flex');
    }

    function closeProfile() {
      profileModal.classList.add('hidden');
      profileModal.classList.remove('flex');
    }

    profileBtn?.addEventListener('click', (e) => { e.preventDefault(); openProfile(); });
    profileClose?.addEventListener('click', (e) => { e.preventDefault(); closeProfile(); });
    profileCancel?.addEventListener('click', (e) => { e.preventDefault(); closeProfile(); });
    profileModal?.addEventListener('click', (e) => { if (e.target === profileModal) closeProfile(); });

    profileLogout?.addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem('user'); window.location.href = '../src/login.html'; });

    profileSave?.addEventListener('click', async (e) => {
      e.preventDefault();
      profileError.classList.add('hidden');
      
      // Mengambil data user dari localStorage (sumber paling tepercaya untuk ID)
      const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
      const id = currentUser.id; // Ambil ID langsung dari objek user

      const usernameVal = document.getElementById('profileUsernameInput').value.trim();
      const emailVal = document.getElementById('profileEmailInput').value.trim();
      const passwordVal = document.getElementById('profilePasswordInput').value;
      const newFoto = document.getElementById('profileFotoInput').files[0];

      // Validasi ID (Penting!)
      if (!id) {
        profileError.textContent = 'Error: User ID tidak ditemukan di penyimpanan lokal. Silakan coba login ulang.';
        profileError.classList.remove('hidden');
        return;
      }

      if (!usernameVal || !emailVal) {
        profileError.textContent = 'Username dan email wajib diisi.';
        profileError.classList.remove('hidden');
        return;
      }

      // Gunakan FormData untuk mengirim data teks dan file
      const fd = new FormData();
      fd.append("id", id); // Sekarang menggunakan ID dari localStorage
      fd.append("username", usernameVal);
      fd.append("email", emailVal);
      if (passwordVal) fd.append("password", passwordVal);
      if (newFoto) fd.append("foto", newFoto);

      const profileSaveBtn = e.target;
      const prevText = profileSaveBtn.textContent;
      profileSaveBtn.disabled = true;
      profileSaveBtn.textContent = 'Saving...';

      try {
        const res = await fetch('http://localhost:3000/login/profile', {
          method: 'PATCH',
          // Tidak perlu headers['Content-Type']='application/json' saat pakai FormData
          body: fd
        });
        const data = await res.json();
        if (!res.ok) {
          profileError.textContent = data.message || 'Gagal memperbarui profile.';
          profileError.classList.remove('hidden');
          return;
        }
        // update localStorage and UI
        localStorage.setItem('user', JSON.stringify(data.user));
        const sb = document.getElementById('sidebarUsername');
        if (sb) sb.textContent = data.user.username;
        
        // Perbarui tampilan avatar di sidebar setelah save berhasil
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) {
            if (data.user.avatar) {
                profileBtn.innerHTML = `<img src="${data.user.avatar}" class="w-full h-full object-cover rounded-full"/>`;
            } else {
                profileBtn.innerHTML = '👤';
            }
        }
        
        alert('Profil berhasil diperbarui!');
        closeProfile();
      } catch (err) {
        profileError.textContent = 'Terjadi kesalahan koneksi.';
        profileError.classList.remove('hidden');
      } finally {
        profileSaveBtn.disabled = false;
        profileSaveBtn.textContent = prevText;
      }
    });

    // Variabel untuk elemen gambar profil baru
    const profileFotoInput = document.getElementById('profileFotoInput');
    const profileAvatar = document.getElementById('profileAvatar');
    const profileAvatarContainer = document.getElementById('profileAvatarContainer');
    const profilePlaceholder = document.getElementById('profileAvatarPlaceholder');

    // Event listener untuk mengklik container avatar agar membuka input file
    profileAvatarContainer?.addEventListener('click', () => {
      profileFotoInput?.click();
    });

    // Event listener untuk menampilkan preview gambar profil
    profileFotoInput?.addEventListener('change', function () {
      if (this.files && this.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          profileAvatar.src = e.target.result;
          profileAvatar.classList.remove('hidden');
          profilePlaceholder.classList.add('hidden');
        };
        reader.readAsDataURL(this.files[0]);
      } else {
        // Jika file dibatalkan, kembalikan ke avatar default atau yang tersimpan
        const u = JSON.parse(localStorage.getItem('user') || '{}');
        if (u.avatar) {
          profileAvatar.src = u.avatar;
          profileAvatar.classList.remove('hidden');
          profilePlaceholder.classList.add('hidden');
        } else {
          profileAvatar.classList.add('hidden');
          profilePlaceholder.classList.remove('hidden');
        }
      }
    });
  </script>

</body>
</html>
